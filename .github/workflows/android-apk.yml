name: Gerar APK Uai Cortes

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Compilar, testar e entregar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: '0.1.4'
      APK_NAME: UaiCortes-v0.1.4.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android API 36 (sem pacote legado tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar e verificar Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar assinatura persistente
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uai-cortes-release.p12"
            chmod 600 "$RUNNER_TEMP/uai-cortes-release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/uai-cortes-release.p12" >> "$GITHUB_ENV"
            echo 'Assinatura persistente ativada.'
          else
            echo 'AVISO: sem os quatro Secrets. A assinatura DEBUG pode impedir atualizações.'
          fi
      - name: Validar código-fonte e política de publicação
        run: python3 tools/validate_source.py
      - name: Testes, Lint e build Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Preparar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" "dist/$APK_NAME"
          test -s "dist/$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/$APK_NAME"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "dist/$APK_NAME")"
          printf '%s\n' "$BADGING" | grep -F "package: name='br.com.uaicortes' versionCode='5' versionName='0.1.4'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'36'"
          sha256sum "dist/$APK_NAME" | tee dist/SHA256SUMS.txt
          echo "APK pronto: $APK_NAME"
      # Sempre arquivar o APK, inclusive em push na main.
      # A interface GitHub Actions baixa artifacts em ZIP por decisão do GitHub.
      - name: Disponibilizar APK em Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UaiCortes-v0.1.4-apk
          path: dist/UaiCortes-v0.1.4.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # Publicar também o .apk SOLTO em Releases, inclusive em push na main.
      # Não usar if: seletivo que pule o passo em builds concluídos.
      - name: Publicar APK diretamente em GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.4"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$APK_NAME" --clobber
          else
            gh release create "$TAG" "dist/$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "Uai Cortes v0.1.4" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
          echo "APK publicado no GitHub Releases: $TAG / $APK_NAME"
      - name: Resumo e localização dos downloads
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## APK disponível ✅'
            echo
            echo "- **Release (APK direto):** [Baixar $APK_NAME](https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$APK_NAME)"
            echo "- **Actions > execução > Artifacts:** UaiCortes-v0.1.4-apk (o GitHub compacta ao baixar)"
            echo "- **SHA-256:** $(awk '{print $1}' dist/SHA256SUMS.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

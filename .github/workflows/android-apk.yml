name: Gerar APK Uai Cortes

on:
  workflow_dispatch:
  push:
    branches: [main]

# A criação de tags pelo gh release NÃO aciona um segundo workflow.
permissions:
  contents: write

jobs:
  android:
    name: Testar e publicar 5 APKs Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: '0.1.62'
      VERSION_CODE: '63'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android API 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar e verificar Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar assinatura persistente
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uai-cortes-release.p12"
            chmod 600 "$RUNNER_TEMP/uai-cortes-release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/uai-cortes-release.p12" >> "$GITHUB_ENV"
            echo 'Assinatura persistente ativada.'
          else
            echo 'AVISO: sem os quatro Secrets, assinatura DEBUG provisória. Atualização poderá falhar.'
          fi
      - name: Validar código-fonte e política de publicação
        run: python3 tools/validate_source.py
      - name: Testes, Lint e compilar Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Preparar e verificar cada APK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_apks.py
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 5
      # Um único destino de distribuição: GitHub Releases, sem Actions Artifacts duplicados.
      - name: Publicar cinco APKs diretos em GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          mapfile -t APKS < <(find dist -maxdepth 1 -type f -name "UaiCortes-v$VERSION-*.apk" | sort)
          test "${#APKS[@]}" -eq 5
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APKS[@]}" --clobber
          else
            gh release create "$TAG" "${APKS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Uai Cortes v$VERSION" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
          for name in arm32 arm64 x86 x86_64 universal; do
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              | grep -Fx "UaiCortes-v$VERSION-$name.apk"
          done
      - name: Resumo com links diretos dos APKs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Uai Cortes: 5 APKs por arquitetura'
            echo
            echo '| Variante | APK direto |'
            echo '|---|---|'
            for name in arm32 arm64 x86 x86_64 universal; do
              apk="UaiCortes-v$VERSION-$name.apk"
              echo "| $name | [Baixar $apk](https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$apk) |"
            done
            echo
            echo 'O APK universal é a escolha simples para a maioria dos aparelhos.'
            echo 'Os APKs por ABI são alternativas: instale apenas um APK por vez.'
            echo '### SHA-256'
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
